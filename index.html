<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A clean to-do lists dashboard with focus timer, tasks, and quick links.">
    <title>To-Do Lists Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Header: theme toggle and greeting -->
    <header class="header">
        <div class="header__top">
            <h1 class="header__title">Dashboard</h1>
            <button id="themeToggle" class="icon-btn" title="Toggle light/dark mode" aria-label="Toggle theme">
                <span class="icon icon--sun">☀️</span>
                <span class="icon icon--moon">🌙</span>
            </button>
        </div>

        <section class="greeting" aria-live="polite">
            <p id="greetingText" class="greeting__text">Hello!</p>
            <p id="customName" class="greeting__name" title="Click to set your name"></p>
            <p id="clock" class="greeting__time">--:--</p>
            <p id="date" class="greeting__date"></p>
        </section>
    </header>

    <main class="main">
        <!-- Focus Timer -->
        <section class="card timer" aria-label="Focus Timer">
            <h2 class="card__title">Focus Timer</h2>
            <div id="timerDisplay" class="timer__display">25:00</div>
            <div class="timer__settings">
                <label for="pomodoroDuration" class="timer__label">Duration (min)</label>
                <input type="number" id="pomodoroDuration" class="timer__input" min="1" max="90" value="25">
            </div>
            <div class="timer__controls">
                <button id="timerStart" class="btn btn--primary">Start</button>
                <button id="timerStop" class="btn">Stop</button>
                <button id="timerReset" class="btn btn--ghost">Reset</button>
            </div>
        </section>

        <!-- To-Do List -->
        <section class="card todo" aria-label="To-Do List">
            <h2 class="card__title">To-Do List</h2>
            <form id="todoForm" class="todo__form">
                <input type="text" id="todoInput" class="todo__input" placeholder="Add a new task..." autocomplete="off" required>
                <button type="submit" class="btn btn--primary">Add</button>
            </form>
            <ul id="todoList" class="todo__list"></ul>
            <p id="todoEmpty" class="todo__empty">No tasks yet. Add one above!</p>
        </section>

        <!-- Quick Links -->
        <section class="card links" aria-label="Quick Links">
            <h2 class="card__title">Quick Links</h2>
            <form id="linkForm" class="links__form">
                <input type="text" id="linkName" class="links__input" placeholder="Name (e.g. GitHub)" autocomplete="off" required>
                <input type="url" id="linkUrl" class="links__input" placeholder="https://..." required>
                <button type="submit" class="btn btn--primary">Add</button>
            </form>
            <div id="linksList" class="links__list"></div>
            <p id="linksEmpty" class="links__empty">No quick links yet. Add one above!</p>
        </section>
    </main>

    <footer class="footer">
        <p>Saved locally in your browser. Works offline.</p>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
